<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>My Music</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HOME -->
    <section id="home">
      <h1>MY MUSIC</h1>
      <h3>Kim MyeongJin</h3>
      <button id="enterBtn">ENTER</button>
    </section>

    <!-- TYPE SELECT -->
    <section id="typeSelect" class="hidden">
      <div class="card" data-type="solo">개인 음악</div>
      <div class="card" data-type="band">밴드 음악</div>
    </section>

    <!-- ALBUM LIST -->
    <section id="albumList" class="hidden">
      <button class="back-btn" data-target="typeSelect">← 뒤로</button>
      <div id="albumContainer"></div>
    </section>

    <!-- PLAYER -->
    <section id="player" class="hidden">
      <button class="back-btn" data-target="albumList">← 뒤로</button>

      <img id="albumCover" />

      <div class="lp-container">
        <img id="lp" class="lp" src="LP/LLP.PNG" />
      </div>

      <ul id="trackList"></ul>

      <div class="progress">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" />
        <span id="duration">0:00</span>
      </div>

      <button id="playBtn">▶</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
